# /usr/lib/sddm/sddm.conf.d/holo.conf
#
# Vendor-default SDDM config marking this as a SteamOS-style setup.
#
# THIS FILE IS LOAD-BEARING FOR MORE THAN AUTOLOGIN.
#
# steamos-manager looks for "holo.conf" or "steamos.conf" in
# /usr/lib/sddm/sddm.conf.d to decide whether session management is supported.
# Without one of them it does NOT expose the
#   com.steampowered.SteamOSManager1.SessionManagement1
# interface at all, and every steamosctl session verb fails with
# "UnknownInterface" - no error explaining why. This is not documented
# anywhere; it was found by string-searching the binary.
#
# steamos-manager then writes its own drop-ins into /etc/sddm.conf.d:
#   zz-holo-autologin.conf    persistent default session
#   zzt-holo-temp-login.conf  one-shot temporary session ("t" = temp), removed
#                             by steamos-manager-session-cleanup.service
#
# Derived from Bazzite (Apache-2.0), with the session changed from
# gamescope-session-ogui-steam (OpenGamepadUI wrapper, handheld-oriented) to the
# plain Steam session.
[General]
DisplayServer=wayland

[Autologin]
Relogin=true
Session=gamescope-session-steam.desktop
